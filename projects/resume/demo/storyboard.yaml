# What demo/terminal.gif films. Format and recording: Zack's dotfiles,
# hermes/skills/creative/demo-video/SKILL.md, "Recording a web app".
app: kups.me
viewport:
  width: 800
  height: 500
appearance: dark
load_timeout_seconds: 60
settle_seconds: 2
notes: |
  800 wide so the GIF plays 1:1 in a README column and the text stays crisp.
  One swipe does one thing, so each `scroll` is one swipe, and each `wait` lets the command
  finish typing and printing. At this size About does not fit on one screen: the second swipe
  reaches its end, and the third starts Work Experience. A different viewport changes that.
  Nothing here submits anything. The clip never reaches the Projects section, so changing a
  project's copy does not make the GIF stale. Changing the profile, Low Rate Co. or the mark does:
  the title bar is in every frame.
  It ends on one typed egg. Zack, 2026-11-07: "Re-record and show one easter egg that is subtle
  like the "logout" one". `logout` prints one line and changes nothing, and the newline in the
  typed text is the Enter key.
  Measured 2026-11-09: a 25 second clip, and a 2.4 MB GIF at 12 frames a second.
  The skill accepts Enter in typed text, and refuses it only into a form, where it would submit.
  Here Enter goes to the page. The committed GIF was recorded headless, from a copy of the skill's
  scripts with one line changed: `headless: false` to true in capture_web_driver.mjs. The skill's
  own driver runs headed, and there the recording started about 2 seconds late, so the opening
  hold on the hero was gone, and the glow cursor showed over the hero. A copy of the scripts needs
  `lib/` from the dotfiles two levels above `hermes/`.
  Look at the last frame of each take: on 2026-11-09 one ended with the top of a row of the next
  card showing under the egg's line, and the next take was clean.
scenes:
  - name: terminal
    path: /
    duration_seconds: 25
    must_show: the hero, the About command printing, the Work Experience command printing, then logout typed and its line
    actions:
      - wait: 2
      - hover: '.terminal-root'
      - scroll: 480
      - wait: 5
      - scroll: 480
      - wait: 1.5
      - scroll: 480
      - wait: 4.5
      - scroll: 480
      - wait: 2
      - type:
          selector: '.terminal-root'
          text: "logout\n"
      - wait: 3
