# What demo/terminal.gif films. Format and recording: Zack's dotfiles,
# hermes/skills/creative/demo-video/SKILL.md, "Recording a web app".
app: kups.me
viewport:
  width: 800
  height: 500
appearance: dark
load_timeout_seconds: 60
settle_seconds: 2
notes: |
  800 wide so the GIF plays 1:1 in a README column and the text stays crisp.
  One swipe does one thing, so each `scroll` is one swipe, and each `wait` lets the command
  finish typing and printing. At this size About does not fit on one screen: the second swipe
  reaches its end, and the third starts Work Experience. A different viewport changes that.
  Nothing here submits anything. The clip never reaches the Projects section, so changing a
  project's copy does not make the GIF stale. Changing the profile or Low Rate Co. does.
  Measured 2026-11-06: a 19 second clip, and a 2.1 MB GIF at 12 frames a second.
  The committed GIF was recorded headless, from a copy of the skill's scripts with only
  `headless: false` changed in capture_web_driver.mjs. The skill's own driver runs headed, and
  there the recording started about 2 seconds late, so the opening hold on the hero was gone,
  and the glow cursor showed over the hero.
scenes:
  - name: terminal
    path: /
    duration_seconds: 19
    must_show: the hero, the About command printing, then the Work Experience command printing
    actions:
      - wait: 2
      - hover: '.terminal-root'
      - scroll: 480
      - wait: 5
      - scroll: 480
      - wait: 1.5
      - scroll: 480
      - wait: 4.5
      - scroll: 480
      - wait: 2
