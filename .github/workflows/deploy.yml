name: Deploy

on:
    push:
        branches: [main]
        paths:
            - 'projects/resume/**'
            - 'projects/infrastructure/**'
            # A change to the pipeline is tried on the day it merges, not on the next site change.
            - '.github/workflows/deploy.yml'
            - '.github/workflows/gates.yml'
            - '.github/scripts/**'
    workflow_dispatch:

permissions:
    contents: read

# One run at a time, in the order the pushes arrived, so an older commit cannot be published
# after a newer one. A run that is deploying is never cancelled: that could stop
# CloudFormation halfway.
concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    gates:
        name: Gates
        uses: ./.github/workflows/gates.yml
        with:
            upload-site: true
        # Passed on every call by convention. The gates job names no environment, so the
        # deploy keys, which are secrets of `production`, do not reach it.
        secrets: inherit

    deploy:
        name: Deploy
        # A red gate means this job never starts.
        needs: gates
        # Only `main` is published. "Run workflow" on another branch runs the gates and stops.
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        environment:
            name: production
            url: https://kups.me
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # The gates job scanned this commit. Scanning again keeps this job safe to run
            # on its own, should the `needs` above ever be removed.
            - name: Scan for a payload
              run: bash .github/scripts/scan-for-payload.sh
            - name: Enable Corepack (Yarn v4)
              run: corepack enable
            - name: Use Node.js from project
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: projects/infrastructure/.nvmrc
                  cache: 'yarn'
                  cache-dependency-path: projects/infrastructure/yarn.lock
            # Not a second build: these are the files the gates job checked.
            - name: Fetch the site the gates job built
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: site
                  path: projects/resume/out
            - name: Confirm the whole site arrived
              env:
                  EXPECTED_FILE_COUNT: ${{ needs.gates.outputs.site-file-count }}
              run: |
                  test -f projects/resume/out/index.html
                  file_count="$(find projects/resume/out -type f | wc -l | tr -d ' ')"
                  printf 'fetched %s files, the gates job built %s\n' "$file_count" "$EXPECTED_FILE_COUNT"
                  test "$file_count" -gt 0
                  test "$file_count" = "$EXPECTED_FILE_COUNT"
            - name: Install `infrastructure` dependencies
              working-directory: projects/infrastructure
              run: yarn install --immutable
            - name: Deploy `infrastructure` via CDK
              working-directory: projects/infrastructure
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_REGION: ${{ secrets.AWS_REGION }}
                  CERTIFICATE_ARN: ${{ secrets.CERTIFICATE_ARN }}
                  CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
              run: yarn cdk deploy --require-approval never
            # The deploy is done by now. A failure here turns the run red and rolls nothing back.
            - name: Check the live site
              run: bash .github/scripts/check-live-site.sh https://kups.me projects/resume/out
